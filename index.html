<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat | Live WebRTC Video & Push Alerts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b141a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #main-container { width: 100%; max-width: 450px; height: 95vh; background: #111b21; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid #222e35; position: relative; }
        
        /* Login Box */
        #login-box { padding: 40px; text-align: center; color: white; margin: auto; width: 100%; }
        #login-box h2 { color: #00a884; margin-bottom: 25px; font-size: 30px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; background: #2a3942; color: white; font-size: 16px; outline: none; }
        .btn-join { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00a884; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Chat Window UI */
        #chat-box { display: none; flex-direction: column; height: 100%; position: relative; }
        .chat-header { padding: 15px; background: #202c33; color: white; display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; }
        .header-info { display: flex; align-items: center; gap: 12px; max-width: 50%; }
        
        #users-display-container { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .header-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; display: flex; flex-direction: column; width: 100%; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; }

        #messages { flex-grow: 1; padding: 15px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-attachment: fixed; background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 8px; }

        .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 15px; position: relative; color: #e9edef; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }

        .msg-info { font-size: 10px; display: block; margin-bottom: 3px; font-weight: bold; color: #34b7f1; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .msg audio { max-width: 100%; margin-top: 5px; display: block; outline: none; }
        
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 10px; opacity: 0.6; margin-top: 4px; }
        .tick { font-size: 12px; color: #8696a0; }
        .tick.seen { color: #34b7f1; }

        .input-bar { padding: 10px; background: #202c33; display: flex; align-items: center; gap: 8px; position: relative; }
        #msg-input { flex-grow: 1; background: #2a3942; padding: 12px 18px; border-radius: 25px; margin: 0; }
        .icon-btn { background: none; border: none; color: #8696a0; cursor: pointer; font-size: 24px; display: flex; align-items: center; transition: color 0.2s; }
        
        .recording-active { color: #ea0038 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* HEADER CALL NOTIFICATION & STATUS PANEL */
        #call-notification { display: none; position: absolute; top: 0; left: 0; width: 100%; background: #00a884; padding: 12px 15px; z-index: 10000; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; font-weight: bold; animation: slideDown 0.25s ease-out; }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        .call-actions-btn { display: flex; gap: 8px; align-items: center; }
        .c-act { padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .c-accept { background: #fff; color: #00a884; }
        .c-reject { background: #ea0038; color: white; }
        .c-mute { background: rgba(255, 255, 255, 0.2); color: white; font-size: 14px; width: 34px; height: 34px; border-radius: 50%; padding: 0; }
        .c-video { background: rgba(255, 255, 255, 0.2); color: white; font-size: 14px; width: 34px; height: 34px; border-radius: 50%; padding: 0; }
        .c-flip { background: #34b7f1; color: white; font-size: 14px; width: 34px; height: 34px; border-radius: 50%; padding: 0; display: none; }
        .c-end { background: #ea0038; color: white; font-size: 14px; width: 34px; height: 34px; border-radius: 50%; padding: 0; }

        /* HIGH-TECH MOVABLE & RESIZABLE OVERLAY WINDOW */
        #video-grid { display: none; position: absolute; bottom: 75px; right: 15px; width: 140px; height: 210px; z-index: 999; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 4px; border: 2px dashed #00a884; box-shadow: 0 10px 25px rgba(0,0,0,0.6); cursor: move; touch-action: none; resize: both; overflow: auto; min-width: 100px; min-height: 150px; max-width: 320px; max-height: 480px; }
        .video-box { width: 100%; height: calc(50% - 2px); background: #202c33; border-radius: 6px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .video-box video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .video-label { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.6); color: white; padding: 1px 4px; border-radius: 3px; font-size: 9px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
        
        /* Custom scrollbar to hide native resize layout handles */
        #video-grid::-webkit-resizer { background: #00a884; border-radius: 50%; border: 3px solid #111b21; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="login-box">
        <h2>VIBE CHAT</h2>
        <input type="text" id="username" placeholder="Apna Naam Likho">
        <input type="text" id="room-code" placeholder="Enter Room Code">
        <button class="btn-join" id="loginBtn">JOIN NOW</button>
    </div>

    <div id="chat-box">
        <div id="video-grid">
            <div class="video-box" id="remote-video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label" id="remote-user-label">User</div>
            </div>
            <div class="video-box" id="local-video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">You</div>
            </div>
        </div>

        <div id="call-notification">
            <span id="caller-name">Incoming Call...</span>
            <div class="call-actions-btn" id="call-controls-wrapper">
                <button class="c-act c-accept" id="acceptCallBtn">Accept</button>
                <button class="c-act c-reject" id="rejectCallBtn">Reject</button>
            </div>
        </div>

        <div class="chat-header">
            <div class="header-info">
                <input type="file" id="profile-input" hidden accept="image/*">
                <div class="header-text">
                    <div id="users-display-container">Connecting Users...</div>
                    <small style="color: #00a884; margin-top: 2px;" id="online-status">online</small>
                </div>
            </div>
            
            <div class="header-actions">
                <label for="wallpaper-input" class="icon-btn" style="color: #00a884; font-size: 20px; margin: 0;">🎨</label>
                <input type="file" id="wallpaper-input" hidden accept="image/*">
                <button class="icon-btn" id="startCallBtn" style="color: #00a884; font-size: 22px;">📞</button>
            </div>
        </div>
        
        <div id="messages"></div>

        <div class="input-bar">
            <label for="file-input" class="icon-btn">📎</label>
            <input type="file" id="file-input" hidden accept="image/*">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button class="icon-btn" id="voiceBtn" style="margin-right: 5px;">🎙️</button>
            <button class="icon-btn" id="sendBtn" style="color: #00a884;">➤</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, update, remove, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
        authDomain: "galk-55f49.firebaseapp.com",
        projectId: "galk-55f49",
        storageBucket: "galk-55f49.firebasestorage.app",
        messagingSenderId: "1005825050326",
        appId: "1:1005825050326:web:fda4271183b4c4ff106b77"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myName, roomID;
    let localStream = null;
    let rtcPeerConnection = null; 
    let isMuted = false;
    let isVideoOn = false;
    let currentFacingMode = "user"; 
    let callTimerInterval = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // Ringtone Audio instance creation
    const callRingtone = new Audio('ring.mp3');
    callRingtone.loop = true;

    const iceConfig = { iceServers: [{ urls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }] };

    document.getElementById('loginBtn').onclick = () => {
        myName = document.getElementById('username').value.trim();
        roomID = document.getElementById('room-code').value.trim();

        if (myName && roomID) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            const userStatusRef = ref(db, `chat_rooms/${roomID}_users/${myName}`);
            set(userStatusRef, { online: true, pfp: "" });
            
            onDisconnect(userStatusRef).remove();
            onDisconnect(ref(db, `webrtc_call/${roomID}`)).remove();
            
            window.addEventListener('beforeunload', () => {
                closeWebRTCCall();
                remove(userStatusRef);
            });

            setupVoiceMessageEngine();
            setupFloatingWindowControls(); // Boot floating drag handlers safely

            onValue(ref(db, `chat_rooms/${roomID}_users`), (snapshot) => {
                const users = snapshot.val();
                const container = document.getElementById('users-display-container');
                container.innerHTML = ""; 

                if (users) {
                    const activeNames = Object.keys(users).map(userKey => userKey === myName ? `${userKey} (You)` : userKey);
                    container.innerText = activeNames.join(", ");
                } else {
                    container.innerText = "Connecting Users...";
                }
            });
            
            const messagesRef = ref(db, 'chat_rooms/' + roomID);
            onChildAdded(messagesRef, (snapshot) => {
                const msgID = snapshot.key;
                const data = snapshot.val();
                if (data.user !== myName && !data.seen) {
                    update(ref(db, `chat_rooms/${roomID}/${msgID}`), { seen: true });
                    
                    if (document.hidden && Notification.permission === "granted") {
                        let notificationBody = "New Message Received";
                        if(data.type === 'text') notificationBody = data.content;
                        else if(data.type === 'image') notificationBody = "📷 Sent an image";
                        else if(data.type === 'audio') notificationBody = "🎵 Sent a voice note";

                        const options = {
                            body: notificationBody,
                            icon: 'https://cdn-icons-png.flaticon.com/512/1041/1041916.png', 
                            vibrate: [200, 100, 200],
                            tag: 'vibe-chat-alert',
                            renotify: true
                        };
                        new Notification(`💬 ${data.user}`, options);
                    }
                }
                renderMessage(msgID, data);
            });

            onChildChanged(messagesRef, (snapshot) => {
                const msgID = snapshot.key;
                const data = snapshot.val();
                if (data.seen) {
                    const tickElement = document.querySelector(`#msg-${msgID} .tick`);
                    if (tickElement) {
                        tickElement.classList.add('seen');
                        tickElement.innerText = '✔️✔️';
                    }
                }
            });

            onValue(messagesRef, (snapshot) => {
                const currentData = snapshot.val() || {};
                const localMsgs = document.querySelectorAll('.msg');
                localMsgs.forEach(msgEl => {
                    const id = msgEl.id.replace('msg-', '');
                    if (!currentData[id] && !id.includes('_users') && !id.includes('_wallpaper')) {
                        msgEl.remove();
                    }
                });
            });

            onValue(ref(db, `chat_rooms/${roomID}_wallpaper`), (snapshot) => {
                const wallpaperData = snapshot.val();
                if (wallpaperData && wallpaperData.img) {
                    document.getElementById('messages').style.backgroundImage = `url('${wallpaperData.img}')`;
                }
            });

            listenForWebRTCSignals();
        } else {
            alert("Name and Room Code Required!");
        }
    };

    // 👆 TOUCH & MOUSE MOVE IMPLEMENTATION PIPELINE FOR THE FLOATING BOX
    function setupFloatingWindowControls() {
        const el = document.getElementById("video-grid");
        let isDragging = false;
        let offsetX = 0, offsetY = 0;

        const startDrag = (e) => {
            // Stop drag event if user clicks native resize bottom-right corner handles
            const rect = el.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            
            if (x > rect.width - 20 && y > rect.height - 20) return; 

            isDragging = true;
            offsetX = (e.clientX || e.touches[0].clientX) - el.offsetLeft;
            offsetY = (e.clientY || e.touches[0].clientY) - el.offsetTop;
        };

        const doDrag = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            
            // Boundary limitations clamp configuration to lock within chat frame
            let left = clientX - offsetX;
            let top = clientY - offsetY;

            el.style.left = `${left}px`;
            el.style.top = `${top}px`;
            el.style.bottom = 'auto';
            el.style.right = 'auto';
        };

        const stopDrag = () => { isDragging = false; };

        el.addEventListener("mousedown", startDrag);
        el.addEventListener("touchstart", startDrag, { passive: false });
        window.addEventListener("mousemove", doDrag);
        window.addEventListener("touchmove", doDrag, { passive: false });
        window.addEventListener("mouseup", stopDrag);
        window.addEventListener("touchend", stopDrag);
    }

    function setupVoiceMessageEngine() {
        const voiceBtn = document.getElementById('voiceBtn');
        voiceBtn.onclick = async () => {
            if (!isRecording) {
                audioChunks = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            push(ref(db, 'chat_rooms/' + roomID), {
                                user: myName, content: reader.result, type: 'audio', seen: false,
                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            });
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('recording-active');
                } catch (err) {
                    alert("Mic Access Denied!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording-active');
            }
        };
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;
        push(ref(db, 'chat_rooms/' + roomID), {
            user: myName, content: text, type: 'text', seen: false,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        input.value = "";
    }
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            push(ref(db, 'chat_rooms/' + roomID), {
                user: myName, content: event.target.result, type: 'image', seen: false,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
        };
        reader.readAsDataURL(file);
    };

    function renderMessage(msgID, data) {
        const container = document.getElementById('messages');
        if (document.getElementById(`msg-${msgID}`)) return;
        const div = document.createElement('div');
        div.id = `msg-${msgID}`;

        const isMe = data.user === myName;
        div.className = `msg ${isMe ? 'sent' : 'received'}`;
        
        let htmlContent = "";
        if(data.type === 'text') htmlContent = `<span>${data.content}</span>`;
        else if(data.type === 'image') htmlContent = `<img src="${data.content}">`;
        else if(data.type === 'audio') htmlContent = `<audio src="${data.content}" controls></audio>`;

        let tickHtml = isMe ? `<span class="tick ${data.seen ? 'seen' : ''}">${data.seen ? '✔️✔️' : '✔️'}</span>` : '';
        div.innerHTML = `<span class="msg-info">${data.user}</span>${htmlContent}<div class="msg-meta"><span>${data.time}</span>${tickHtml}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // Dynamic Engine Wallpaper system hooks
    document.getElementById('wallpaper-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            set(ref(db, `chat_rooms/${roomID}_wallpaper`), { img: event.target.result });
        };
        reader.readAsDataURL(file);
    };

    /* =========================================================================
       WEBRTC REALTIME COMPLEX ENGINE INTEGRATION ENGINE
       ========================================================================= */
    function listenForWebRTCSignals() {
        const callRef = ref(db, `webrtc_call/${roomID}`);
        onValue(callRef, async (snapshot) => {
            const session = snapshot.val();
            if (!session) {
                closeWebRTCCall();
                return;
            }

            if (session.caller !== myName) {
                if (session.type === 'offer' && !rtcPeerConnection) {
                    document.getElementById('caller-name').innerText = `Incoming: ${session.caller}`;
                    document.getElementById('call-notification').style.display = 'flex';
                    
                    // Plays audio instantly upon receiving dynamic signature from network state
                    callRingtone.play().catch(e => console.log("User interaction required for ringtone"));

                    document.getElementById('acceptCallBtn').onclick = async () => {
                        // Stop tone safely on accept
                        callRingtone.pause();
                        callRingtone.currentTime = 0;
                        
                        document.getElementById('call-notification').style.display = 'none';
                        await initializeMediaPipeline();
                        await setupRTCConnectionEndpoints();

                        await rtcPeerConnection.setRemoteDescription(new RTCSessionDescription(session.sdp));
                        const answer = await rtcPeerConnection.createAnswer();
                        await rtcPeerConnection.setLocalDescription(answer);

                        update(callRef, { type: 'answer', sdp: answer });
                        document.getElementById('remote-user-label').innerText = session.caller;
                        startCallTimerCounter();
                    };

                    document.getElementById('rejectCallBtn').onclick = () => {
                        // Stop tone safely on reject
                        callRingtone.pause();
                        callRingtone.currentTime = 0;
                        remove(callRef);
                    };
                } else if (session.type === 'answer' && rtcPeerConnection) {
                    await rtcPeerConnection.setRemoteDescription(new RTCSessionDescription(session.sdp));
                    startCallTimerCounter();
                }

                if (session.iceCandidate && rtcPeerConnection) {
                    try {
                        await rtcPeerConnection.addIceCandidate(new RTCIceCandidate(session.iceCandidate));
                    } catch (e) { console.error(e); }
                }
            }
        });
    }

    async function initializeMediaPipeline() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode },
                audio: true
            });
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('video-grid').style.display = 'flex';
            isVideoOn = true;
        } catch (err) {
            alert("Camera/Microphone failure initialization error!");
        }
    }

    async function setupRTCConnectionEndpoints() {
        rtcPeerConnection = new RTCPeerConnection(iceConfig);
        
        localStream.getTracks().forEach(track => rtcPeerConnection.addTrack(track, localStream));

        rtcPeerConnection.ontrack = (event) => {
            document.getElementById('remoteVideo').srcObject = event.streams[0];
        };

        rtcPeerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                update(ref(db, `webrtc_call/${roomID}`), { iceCandidate: event.candidate.toJSON() });
            }
        };
    }

    document.getElementById('startCallBtn').onclick = async () => {
        await initializeMediaPipeline();
        await setupRTCConnectionEndpoints();

        const offer = await rtcPeerConnection.createOffer();
        await rtcPeerConnection.setLocalDescription(offer);

        set(ref(db, `webrtc_call/${roomID}`), {
            caller: myName, type: 'offer', sdp: offer
        });

        transformInterfaceToActiveCallPanel();
    };

    function transformInterfaceToActiveCallPanel() {
        const wrapper = document.getElementById('call-controls-wrapper');
        document.getElementById('caller-name').innerText = "Calling User...";
        document.getElementById('call-notification').style.display = 'flex';

        wrapper.innerHTML = `
            <button class="c-act c-mute" id="action-mute">🎙️</button>
            <button class="c-act c-video" id="action-video">📹</button>
            <button class="c-act c-flip" id="action-flip" style="display:block;">🔄</button>
            <button class="c-act c-end" id="action-end">❌</button>
        `;

        document.getElementById('action-mute').onclick = () => {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('action-mute').style.background = isMuted ? '#ea0038' : 'rgba(255, 255, 255, 0.2)';
        };

        document.getElementById('action-video').onclick = () => {
            isVideoOn = !isVideoOn;
            localStream.getVideoTracks()[0].enabled = isVideoOn;
            document.getElementById('action-video').style.background = isVideoOn ? 'rgba(255, 255, 255, 0.2)' : '#ea0038';
        };

        document.getElementById('action-flip').onclick = async () => {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            await initializeMediaPipeline();
            const videoSender = rtcPeerConnection.getSenders().find(s => s.track.kind === 'video');
            if (videoSender) {
                videoSender.replaceTrack(localStream.getVideoTracks()[0]);
            }
        };

        document.getElementById('action-end').onclick = () => {
            remove(ref(db, `webrtc_call/${roomID}`));
        };
    }

    function startCallTimerCounter() {
        clearInterval(callTimerInterval);
        let seconds = 0;
        
        // Rebuild call management layout frame mapping for answered states safely 
        const wrapper = document.getElementById('call-controls-wrapper');
        wrapper.innerHTML = `
            <button class="c-act c-mute" id="action-mute">🎙️</button>
            <button class="c-act c-video" id="action-video">📹</button>
            <button class="c-act c-flip" id="action-flip" style="display:block;">🔄</button>
            <button class="c-act c-end" id="action-end">❌</button>
        `;

        document.getElementById('call-notification').style.display = 'flex';

        document.getElementById('action-mute').onclick = () => {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('action-mute').style.background = isMuted ? '#ea0038' : 'rgba(255, 255, 255, 0.2)';
        };

        document.getElementById('action-video').onclick = () => {
            isVideoOn = !isVideoOn;
            localStream.getVideoTracks()[0].enabled = isVideoOn;
            document.getElementById('action-video').style.background = isVideoOn ? 'rgba(255, 255, 255, 0.2)' : '#ea0038';
        };

        document.getElementById('action-flip').onclick = async () => {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            await initializeMediaPipeline();
            const videoSender = rtcPeerConnection.getSenders().find(s => s.track.kind === 'video');
            if (videoSender) {
                videoSender.replaceTrack(localStream.getVideoTracks()[0]);
            }
        };

        document.getElementById('action-end').onclick = () => {
            remove(ref(db, `webrtc_call/${roomID}`));
        };

        callTimerInterval = setInterval(() => {
            seconds++;
            let mins = Math.floor(seconds / 60);
            let secs = seconds % 60;
            document.getElementById('caller-name').innerText = `Active Call: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    }

    function closeWebRTCCall() {
        // Ensures tone stops playing if room signal changes abruptly or terminates
        callRingtone.pause();
        callRingtone.currentTime = 0;

        clearInterval(callTimerInterval);
        document.getElementById('call-notification').style.display = 'none';
        document.getElementById('video-grid').style.display = 'none';
        
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (rtcPeerConnection) {
            rtcPeerConnection.close();
            rtcPeerConnection = null;
        }

        const wrapper = document.getElementById('call-controls-wrapper');
        if(wrapper) {
            wrapper.innerHTML = `
                <button class="c-act c-accept" id="acceptCallBtn">Accept</button>
                <button class="c-act c-reject" id="rejectCallBtn">Reject</button>
            `;
        }
        isMuted = false; isVideoOn = false; currentFacingMode = "user";
    }
</script>
</body>
</html>
