<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat | Live Call Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b141a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #main-container { width: 100%; max-width: 450px; height: 95vh; background: #111b21; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid #222e35; position: relative; }
        
        /* Login UI */
        #login-box { padding: 40px; text-align: center; color: white; margin: auto; width: 100%; }
        #login-box h2 { color: #00a884; margin-bottom: 25px; font-size: 30px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; background: #2a3942; color: white; font-size: 16px; outline: none; }
        .btn-join { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00a884; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Chat View UI */
        #chat-box { display: none; flex-direction: column; height: 100%; position: relative; }
        .chat-header { padding: 15px; background: #202c33; color: white; display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; }
        
        #users-display-container { font-size: 15px; color: white; font-weight: 500; }
        .icon-btn { background: none; border: none; color: #8696a0; cursor: pointer; font-size: 24px; display: flex; align-items: center; }

        #messages { flex-grow: 1; padding: 15px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; gap: 8px; }

        .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 15px; color: #e9edef; }
        .sent { background: #005c4b; align-self: flex-end; }
        .received { background: #202c33; align-self: flex-start; }
        .msg-info { font-size: 10px; display: block; margin-bottom: 3px; font-weight: bold; color: #34b7f1; }

        .input-bar { padding: 10px; background: #202c33; display: flex; align-items: center; gap: 8px; }
        #msg-input { flex-grow: 1; background: #2a3942; padding: 12px 18px; border-radius: 25px; margin: 0; color: white; border: none; outline: none; }

        /* FLOATING VIDEO BOX */
        #video-container { display: none; position: absolute; top: 80px; right: 15px; width: 180px; height: 260px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 2px solid #00a884; z-index: 999; }
        #video-grid { display: flex; flex-direction: column; gap: 2px; width: 100%; height: 100%; }
        .video-box { position: relative; width: 100%; height: 50%; background: #222; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-controls { position: absolute; bottom: 10px; left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 1000; }
        .v-btn { background: #202c33; border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .v-btn.end-call { background: #ea0038; }

        /* REALTIME HEADER NOTIFICATION FIXED CSS */
        #call-notification { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: #00a884; 
            padding: 18px 20px; 
            z-index: 999999; 
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            color: white; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); 
            font-weight: bold; 
            font-size: 16px; 
            border-bottom: 3px solid #005c4b;
            transform: translateY(-100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        /* Call slide down trigger */
        #call-notification.active {
            transform: translateY(0);
        }
        .call-actions-btn { display: flex; gap: 12px; }
        .c-act { padding: 10px 22px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .c-accept { background: #ffffff; color: #00a884; }
        .c-reject { background: #ea0038; color: white; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="login-box">
        <h2>VIBE CHAT</h2>
        <input type="text" id="username" placeholder="Apna Naam Likho">
        <input type="text" id="room-code" placeholder="Enter Room Code">
        <button class="btn-join" id="loginBtn">JOIN NOW</button>
    </div>

    <div id="chat-box">
        <div id="call-notification">
            <span id="caller-name">Incoming Call...</span>
            <div class="call-actions-btn">
                <button class="c-act c-accept" id="acceptCallBtn">Accept</button>
                <button class="c-act c-reject" id="rejectCallBtn">Reject</button>
            </div>
        </div>

        <div class="chat-header">
            <div id="users-display-container">Connecting Users...</div>
            <div class="header-actions">
                <button class="icon-btn" id="startCallBtn" style="color: #00a884;">📹</button>
            </div>
        </div>
        
        <div id="messages"></div>

        <div id="video-container">
            <div id="video-grid"></div>
            <div class="video-controls">
                <button class="v-btn end-call" id="endCallBtn">📞</button>
            </div>
        </div>

        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button class="icon-btn" id="sendBtn" style="color: #00a884;">➤</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, update, remove, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
        authDomain: "galk-55f49.firebaseapp.com",
        projectId: "galk-55f49",
        storageBucket: "galk-55f49.firebasestorage.app",
        messagingSenderId: "1005825050326",
        appId: "1:1005825050326:web:fda4271183b4c4ff106b77"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myName, roomID, localStream = null, rtcPeerConnection = null;
    const iceConfig = { iceServers: [{ urls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }] };

    document.getElementById('loginBtn').onclick = () => {
        myName = document.getElementById('username').value.trim();
        roomID = document.getElementById('room-code').value.trim();

        if (myName && roomID) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            
            const userStatusRef = ref(db, `chat_rooms/${roomID}_users/${myName}`);
            set(userStatusRef, { online: true });
            onDisconnect(userStatusRef).remove();
            onDisconnect(ref(db, `webrtc_call/${roomID}`)).remove();

            onValue(ref(db, `chat_rooms/${roomID}_users`), (snapshot) => {
                const users = snapshot.val();
                if (users) {
                    document.getElementById('users-display-container').innerText = Object.keys(users).join(", ");
                }
            });
            
            onChildAdded(ref(db, 'chat_rooms/' + roomID), (snapshot) => {
                renderMessage(snapshot.key, snapshot.val());
            });

            listenForCalls();
        }
    };

    function sendMessage() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim()) return;
        push(ref(db, 'chat_rooms/' + roomID), {
            user: myName, content: input.value.trim(),
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        input.value = "";
    }
    document.getElementById('sendBtn').onclick = sendMessage;

    function renderMessage(msgID, data) {
        const container = document.getElementById('messages');
        if (document.getElementById(`msg-${msgID}`)) return;
        const div = document.createElement('div');
        div.id = `msg-${msgID}`;
        div.className = `msg ${data.user === myName ? 'sent' : 'received'}`;
        div.innerHTML = `<span class="msg-info">${data.user}</span><span>${data.content}</span>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    async function initMedia() {
        if (!localStream) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('video-container').style.display = 'block';
                setupVideoElement("local-video", localStream, "You");
            } catch (e) {
                alert("Camera/Mic Permission Access Denied!");
                return null;
            }
        }
        return localStream;
    }

    function setupVideoElement(id, stream, userLabel) {
        const grid = document.getElementById('video-grid');
        let box = document.getElementById(id);
        if (!box) {
            box = document.createElement('div');
            box.id = id; box.className = 'video-box';
            const v = document.createElement('video');
            v.autoplay = true; v.playsInline = true; v.muted = (id === "local-video");
            box.appendChild(v); grid.appendChild(box);
            v.srcObject = stream;
        }
    }

    async function makeCall() {
        const stream = await initMedia();
        if (!stream) return;

        rtcPeerConnection = new RTCPeerConnection(iceConfig);
        stream.getTracks().forEach(t => rtcPeerConnection.addTrack(t, stream));
        rtcPeerConnection.ontrack = (e) => setupVideoElement("remote-video", e.streams[0], "Remote");
        rtcPeerConnection.onicecandidate = (e) => {
            if (e.candidate) push(ref(db, `webrtc_call/${roomID}/candidates/${myName}`), e.candidate.toJSON());
        };

        const offer = await rtcPeerConnection.createOffer();
        await rtcPeerConnection.setLocalDescription(offer);

        await remove(ref(db, `webrtc_call/${roomID}`));
        set(ref(db, `webrtc_call/${roomID}`), {
            caller: myName,
            status: "ringing",
            offer: { type: offer.type, sdp: offer.sdp }
        });
    }

    function listenForCalls() {
        onValue(ref(db, `webrtc_call/${roomID}`), async (snapshot) => {
            const data = snapshot.val();
            const panel = document.getElementById('call-notification');
            
            if (!data) {
                panel.classList.remove('active');
                return;
            }

            if (data.status === "ringing" && data.caller !== myName) {
                document.getElementById('caller-name').innerText = `Call From: ${data.caller}`;
                // CSS Trigger Class Add Kiye Bina Display Block Ki Problem Solve
                panel.classList.add('active');

                document.getElementById('acceptCallBtn').onclick = async () => {
                    panel.classList.remove('active');
                    const stream = await initMedia();
                    if (!stream) return;

                    rtcPeerConnection = new RTCPeerConnection(iceConfig);
                    stream.getTracks().forEach(t => rtcPeerConnection.addTrack(t, stream));
                    rtcPeerConnection.ontrack = (e) => setupVideoElement("remote-video", e.streams[0], data.caller);
                    rtcPeerConnection.onicecandidate = (e) => {
                        if (e.candidate) push(ref(db, `webrtc_call/${roomID}/candidates/${myName}`), e.candidate.toJSON());
                    };

                    await rtcPeerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await rtcPeerConnection.createAnswer();
                    await rtcPeerConnection.setLocalDescription(answer);

                    update(ref(db, `webrtc_call/${roomID}`), { status: "accepted", answer: { type: answer.type, sdp: answer.sdp } });

                    onChildAdded(ref(db, `webrtc_call/${roomID}/candidates/${data.caller}`), (cSnap) => {
                        if (cSnap.exists() && rtcPeerConnection) rtcPeerConnection.addIceCandidate(new RTCIceCandidate(cSnap.val())).catch(e=>{});
                    });
                };

                document.getElementById('rejectCallBtn').onclick = () => {
                    panel.classList.remove('active');
                    update(ref(db, `webrtc_call/${roomID}`), { status: "rejected" });
                };
            }
            else if (data.status === "accepted" && data.caller === myName && data.answer && rtcPeerConnection) {
                if (rtcPeerConnection.signalingState === "have-local-offer") {
                    await rtcPeerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
                onChildAdded(ref(db, `webrtc_call/${roomID}/candidates`), (snapshot) => {
                    if (snapshot.key !== myName && rtcPeerConnection) {
                        snapshot.forEach(c => rtcPeerConnection.addIceCandidate(new RTCIceCandidate(c.val())).catch(e=>{}));
                    }
                });
            }
            else if (data.status === "rejected" || data.status === "ended") {
                killCall();
            }
        });
    }

    function killCall() {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (rtcPeerConnection) rtcPeerConnection.close();
        localStream = null; rtcPeerConnection = null;
        document.getElementById('video-container').style.display = 'none';
        document.getElementById('video-grid').innerHTML = '';
        document.getElementById('call-notification').classList.remove('active');
        remove(ref(db, `webrtc_call/${roomID}`));
    }

    document.getElementById('startCallBtn').onclick = makeCall;
    document.getElementById('endCallBtn').onclick = killCall;
</script>
</body>
</html>
