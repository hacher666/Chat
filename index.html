<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat Live</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0b141a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #main-container { width: 100%; max-width: 450px; height: 95vh; background: #111b21; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.5); border: 1px solid #222e35; }
        
        /* Login */
        #login-box { padding: 40px; text-align: center; color: #e9edef; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #2a3942; color: white; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #00a884; color: white; font-weight: bold; cursor: pointer; }

        /* Chat UI */
        #chat-box { display: none; flex-direction: column; height: 100%; }
        .header { padding: 15px; background: #202c33; color: #e9edef; display: flex; align-items: center; gap: 15px; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; color: white; font-size: 15px; position: relative; }
        .sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .user-label { font-size: 11px; color: #ffd700; display: block; margin-bottom: 3px; font-weight: bold; }

        .input-area { padding: 10px; background: #202c33; display: flex; gap: 10px; align-items: center; }
        #msg-input { flex-grow: 1; background: #2a3942; margin: 0; }
        img { max-width: 200px; border-radius: 8px; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="login-box">
        <h2>WhatsApp Clone</h2>
        <input type="text" id="username" placeholder="Apna Naam">
        <input type="text" id="room-code" placeholder="Room Code (Same code = Same Chat)">
        <button onclick="initChat()">Join Chat</button>
    </div>

    <div id="chat-box">
        <div class="header">
            <div style="width: 40px; height: 40px; background: #6a7175; border-radius: 50%;"></div>
            <div><strong id="room-name">Room</strong><br><small style="color: #00a884;">online</small></div>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="file" id="file-input" hidden onchange="sendPhoto(this)">
            <button style="width: auto; background: none; font-size: 20px;" onclick="document.getElementById('file-input').click()">📎</button>
            <input type="text" id="msg-input" placeholder="Message likho...">
            <button style="width: auto;" onclick="sendText()">➤</button>
        </div>
    </div>
</div>

<script>
    let peer, conn, myName, roomID;

    function initChat() {
        myName = document.getElementById('username').value;
        roomID = document.getElementById('room-code').value;

        if(!myName || !roomID) return alert("Details bharo!");

        // Peer ID format: RoomID_UserName
        peer = new Peer(roomID + "-" + myName, {
            debug: 2
        });

        peer.on('open', (id) => {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            document.getElementById('room-name').innerText = "Room: " + roomID;
            
            // Dusre user ko connect karne ki koshish (Simple logic for 2 people)
            // Note: P2P mein connection handle karna thoda tricky hota hai
            alert("Ready! Agar dusra user bhi isi code se join karega toh chat hogi.");
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupReceiver();
        });

        // Try connecting to a peer if they are already there
        // (Isme hume pata hona chahiye ki dusra user kaun hai)
    }

    function sendText() {
        let text = document.getElementById('msg-input').value;
        if(!text) return;
        let data = { user: myName, type: 'text', content: text };
        renderMsg(data, true);
        if(conn) conn.send(data);
        document.getElementById('msg-input').value = "";
    }

    function sendPhoto(input) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let data = { user: myName, type: 'img', content: e.target.result };
                renderMsg(data, true);
                if(conn) conn.send(data);
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function setupReceiver() {
        conn.on('data', (data) => {
            renderMsg(data, false);
        });
    }

    function renderMsg(data, isMe) {
        let div = document.createElement('div');
        div.className = isMe ? "msg sent" : "msg received";
        let inner = `<span class="user-label">${data.user}</span>`;
        if(data.type === 'text') inner += data.content;
        else inner += `<img src="${data.content}">`;
        
        div.innerHTML = inner;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }
</script>
</body>
</html>
