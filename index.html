<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy P2P Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        /* Glassmorphism Design */
        #main-container {
            width: 100%; max-width: 450px; height: 90vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Login Screen */
        #login-box { padding: 40px; text-align: center; color: white; margin: auto; }
        #login-box h2 { margin-bottom: 20px; letter-spacing: 2px; }
        input[type="text"] {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 10px; border: none; background: rgba(255,255,255,0.9);
            font-size: 16px; outline: none;
        }
        .btn-join {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: #00d2ff; color: white; font-weight: bold;
            cursor: pointer; transition: 0.3s; font-size: 16px;
        }
        .btn-join:hover { background: #3a7bd5; transform: scale(1.02); }

        /* Chat Screen */
        #chat-box { display: none; flex-direction: column; height: 100%; }
        .chat-header { 
            padding: 15px; background: rgba(0, 0, 0, 0.3); color: white;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        #messages { 
            flex-grow: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); /* WhatsApp pattern */
        }

        .msg { 
            max-width: 75%; padding: 10px 15px; border-radius: 15px; 
            font-size: 14.5px; position: relative; line-height: 1.4;
            color: #fff;
        }
        .msg.received { background: #3d3d5c; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.sent { background: #056162; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg .sender-name { font-size: 10px; opacity: 0.7; display: block; margin-bottom: 4px; }
        
        /* Input Area */
        .input-area { 
            padding: 15px; background: rgba(0,0,0,0.4); display: flex; gap: 10px; align-items: center;
        }
        #message-input { flex-grow: 1; border-radius: 25px; padding: 10px 15px; border: none; outline: none; }
        .icon-btn { color: white; cursor: pointer; font-size: 20px; background: none; border: none; }
        
        /* Image Preview */
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 5px; cursor: pointer; }

        /* Custom Scrollbar */
        #messages::-webkit-scrollbar { width: 5px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="login-box">
        <h2>VIBE CHAT</h2>
        <p style="font-size: 12px; opacity: 0.6; margin-bottom: 20px;">Enter a Room Code to start private chatting</p>
        <input type="text" id="username" placeholder="Your Name">
        <input type="text" id="room-code" placeholder="Room Secret Code">
        <button class="btn-join" onclick="startChat()">JOIN ROOM</button>
    </div>

    <div id="chat-box">
        <div class="chat-header">
            <div>
                <strong id="display-room">Room</strong>
                <div style="font-size: 10px; color: #00ff88;">● Online</div>
            </div>
            <button class="icon-btn" onclick="location.reload()">✕</button>
        </div>

        <div id="messages">
            </div>

        <div class="input-area">
            <label for="file-input" class="icon-btn">📎</label>
            <input type="file" id="file-input" hidden accept="image/*">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button class="icon-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
    let peer, conn, myName, roomID;

    function startChat() {
        myName = document.getElementById('username').value.trim();
        roomID = document.getElementById('room-code').value.trim();

        if (!myName || !roomID) return alert("Details bharo pehle!");

        // Peer ID setup: 'RoomName-Username' logic for P2P discovery
        // Note: Real-time discovery bina server ke PeerJS mein manually karni padti hai
        peer = new Peer(myName + "-" + roomID);

        peer.on('open', (id) => {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            document.getElementById('display-room').innerText = "Room: " + roomID;
        });

        peer.on('connection', (c) => {
            conn = c;
            receiveData();
        });
        
        // Connect attempt to potential peer in the same room
        // Yahan aapko manually connect karna pad sakta hai ya Firebase use karna hoga list ke liye
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        const fileInput = document.getElementById('file-input');
        
        if (input.value.trim() === "" && fileInput.files.length === 0) return;

        let dataObj = { user: myName, msg: input.value, type: 'text' };

        if (fileInput.files.length > 0) {
            const reader = new FileReader();
            reader.onload = function(e) {
                dataObj.msg = e.target.result;
                dataObj.type = 'image';
                displayMessage(dataObj, true);
                // conn.send(dataObj); // Jab connect ho jaye
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            displayMessage(dataObj, true);
            input.value = "";
        }
    }

    function displayMessage(data, isSelf) {
        const chatWindow = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = isSelf ? "msg sent" : "msg received";
        
        let content = type === 'text' ? data.msg : `<img src="${data.msg}">`;
        
        msgDiv.innerHTML = `
            <span class="sender-name">${data.user}</span>
            ${type === 'text' ? data.msg : `<img src="${data.msg}">`}
        `;
        
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function receiveData() {
        conn.on('data', (data) => {
            displayMessage(data, false);
        });
    }
</script>

</body>
</html>
