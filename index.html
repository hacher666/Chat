<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat | Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #0b141a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #main-container { width: 100%; max-width: 450px; height: 95vh; background: #111b21; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; border: 1px solid #222e35; position: relative; }
        
        #login-box { padding: 40px; text-align: center; color: white; margin: auto; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; background: #2a3942; color: white; }
        .btn-join { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00a884; color: white; cursor: pointer; }

        #chat-box { display: none; flex-direction: column; height: 100%; }
        .chat-header { padding: 15px; background: #202c33; color: white; display: flex; align-items: center; justify-content: space-between; }
        #messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; color: #e9edef; font-size: 15px; position: relative; }
        .sent { background: #005c4b; align-self: flex-end; }
        .received { background: #202c33; align-self: flex-start; }
        
        #video-container { display: none; position: absolute; top: 70px; right: 10px; width: 150px; height: 200px; background: #000; border-radius: 10px; z-index: 999; resize: both; overflow: auto; border: 2px solid #00a884; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { width: 40px; height: 50px; position: absolute; bottom: 5px; right: 5px; border-radius: 4px; border: 1px solid white; }
        
        #call-modal { display: none; position: absolute; top: 30%; left: 10%; width: 80%; background: #202c33; padding: 20px; border-radius: 15px; color: white; text-align: center; z-index: 1000; border: 2px solid #00a884; }
        .input-bar { padding: 10px; background: #202c33; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="login-box">
        <h2>VIBE CHAT</h2>
        <input type="text" id="username" placeholder="Apna Naam">
        <input type="text" id="room-code" placeholder="Room Code">
        <button class="btn-join" id="loginBtn">JOIN NOW</button>
    </div>

    <div id="chat-box">
        <div class="chat-header">
            <strong id="display-user">User</strong>
            <button id="startCallBtn">📹 Call</button>
        </div>
        <div id="messages"></div>
        
        <div id="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <button id="endCallBtn" style="position:absolute; top:0; left:0; background:red; color:white; border:none; padding:5px;">End</button>
        </div>

        <div id="call-modal">
            <p id="caller-text">Incoming Call...</p>
            <button id="acceptBtn" class="btn-join" style="background:green; margin-top:10px;">Accept</button>
            <button id="rejectBtn" class="btn-join" style="background:red; margin-top:10px;">Reject</button>
        </div>

        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="Type...">
            <button id="micBtn">🎤</button>
            <button id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onValue, set, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
        authDomain: "galk-55f49.firebaseapp.com",
        projectId: "galk-55f49",
        storageBucket: "galk-55f49.firebasestorage.app",
        messagingSenderId: "1005825050326",
        appId: "1:1005825050326:web:fda4271183b4c4ff106b77",
        measurementId: "G-32CW801HFV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myName, roomID, mediaRecorder, audioChunks = [];

    document.getElementById('loginBtn').onclick = () => {
        myName = document.getElementById('username').value.trim();
        roomID = document.getElementById('room-code').value.trim();
        if(!myName || !roomID) return alert("Fill fields!");
        
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('chat-box').style.display = 'flex';
        document.getElementById('display-user').innerText = myName;

        onChildAdded(ref(db, 'rooms/' + roomID), (snap) => {
            const msgID = snap.key;
            const data = snap.val();
            const div = document.createElement('div');
            div.id = `msg-${msgID}`;
            div.className = `msg ${data.user === myName ? 'sent' : 'received'}`;
            div.innerHTML = data.type === 'audio' ? `<audio controls src="${data.content}"></audio>` : `<span>${data.content}</span>`;
            document.getElementById('messages').appendChild(div);

            setTimeout(() => {
                if(document.getElementById(`msg-${msgID}`)) document.getElementById(`msg-${msgID}`).remove();
                remove(ref(db, `rooms/${roomID}/${msgID}`));
            }, 10000);
        });

        onValue(ref(db, `calls/${roomID}`), (snap) => {
            const data = snap.val();
            if (data && data.caller !== myName && !data.answered) {
                document.getElementById('call-modal').style.display = 'block';
                document.getElementById('caller-text').innerText = data.caller + " is calling...";
            }
        });
    };

    document.getElementById('sendBtn').onclick = () => {
        const text = document.getElementById('msg-input').value;
        push(ref(db, 'rooms/' + roomID), { user: myName, content: text, type: 'text' });
        document.getElementById('msg-input').value = "";
    };

    document.getElementById('micBtn').onmousedown = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const reader = new FileReader();
            reader.readAsDataURL(new Blob(audioChunks));
            reader.onloadend = () => push(ref(db, 'rooms/' + roomID), { user: myName, content: reader.result, type: 'audio' });
        };
        mediaRecorder.start();
    };
    document.getElementById('micBtn').onmouseup = () => mediaRecorder.stop();

    document.getElementById('startCallBtn').onclick = () => {
        set(ref(db, `calls/${roomID}`), { caller: myName, answered: false });
        document.getElementById('video-container').style.display = 'block';
    };

    document.getElementById('acceptBtn').onclick = () => {
        document.getElementById('call-modal').style.display = 'none';
        document.getElementById('video-container').style.display = 'block';
    };

    document.getElementById('endCallBtn').onclick = () => {
        document.getElementById('video-container').style.display = 'none';
        set(ref(db, `calls/${roomID}`), null);
    };
</script>
</body>
</html>
