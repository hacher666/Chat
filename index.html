<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat | Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b141a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #main-container { width: 100%; max-width: 450px; height: 95vh; background: #111b21; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid #222e35; position: relative; }
        
        /* Login */
        #login-box { padding: 40px; text-align: center; color: white; margin: auto; width: 100%; }
        #login-box h2 { color: #00a884; margin-bottom: 25px; font-size: 30px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; background: #2a3942; color: white; font-size: 16px; outline: none; }
        .btn-join { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00a884; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Chat UI */
        #chat-box { display: none; flex-direction: column; height: 100%; }
        .chat-header { padding: 15px; background: #202c33; color: white; display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; }
        .header-info { display: flex; align-items: center; gap: 12px; max-width: 70%; }
        
        /* 🔥 Dynamic Avatar Styling (Clickable) */
        .avatar { width: 40px; height: 40px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; flex-shrink: 0; cursor: pointer; overflow: hidden; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.2); }
        .header-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Action Buttons on Header */
        .header-actions { display: flex; align-items: center; gap: 15px; }

        /* Wallpaper Default Background */
        #messages { flex-grow: 1; padding: 15px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-attachment: fixed; background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 8px; transition: background 0.5s ease-in-out; }

        .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 15px; position: relative; color: #e9edef; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .msg-info { font-size: 10px; display: block; margin-bottom: 3px; font-weight: bold; color: #34b7f1; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }

        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 10px; opacity: 0.6; margin-top: 4px; }
        .tick { font-size: 12px; color: #8696a0; }
        .tick.seen { color: #34b7f1; }

        .input-bar { padding: 10px; background: #202c33; display: flex; align-items: center; gap: 8px; }
        #msg-input { flex-grow: 1; background: #2a3942; padding: 12px 18px; border-radius: 25px; margin: 0; }
        .icon-btn { background: none; border: none; color: #8696a0; cursor: pointer; font-size: 24px; display: flex; align-items: center; }

        /* Video Call Floating Window Overlay */
        #video-container { display: none; position: absolute; top: 75px; right: 15px; width: 140px; height: 210px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 2px solid #00a884; z-index: 999; cursor: move; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { width: 45px; height: 65px; object-fit: cover; position: absolute; bottom: 8px; right: 8px; border-radius: 6px; border: 1px solid white; background: #222; }
        
        .video-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; opacity: 0; transition: opacity 0.3s; background: rgba(0,0,0,0.3); }
        #video-container:hover .video-controls { opacity: 1; }
        .control-row { display: flex; justify-content: space-between; width: 100%; }
        .v-btn { background: rgba(32, 44, 51, 0.9); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .v-btn.end-call { background: #ea0038; }

        /* Call Notification Bar Layout */
        #call-notification { display: none; position: absolute; top: 65px; left: 5%; width: 90%; background: #202c33; padding: 10px 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; justify-content: space-between; align-items: center; color: white; border: 1px solid #00a884; }
        .call-actions-btn { display: flex; gap: 10px; }
        .c-act { padding: 6px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .c-accept { background: #00a884; }
        .c-reject { background: #ea0038; }
    </style>
</head>
<body>

<div id="main-container">
    <!-- Login Screen -->
    <div id="login-box">
        <h2>VIBE CHAT</h2>
        <input type="text" id="username" placeholder="Apna Naam Likho">
        <input type="text" id="room-code" placeholder="Enter Room Code">
        <button class="btn-join" id="loginBtn">JOIN NOW</button>
    </div>

    <!-- Chat Window Screen -->
    <div id="chat-box">
        <div class="chat-header">
            <div class="header-info">
                <!-- 🔥 Hidden Input Profile Photo Ke Liye -->
                <input type="file" id="profile-input" hidden accept="image/*">
                <div class="avatar" id="room-avatar" title="Click to change profile photo">💬</div>
                
                <div class="header-text">
                    <strong id="display-room">Connecting...</strong><br>
                    <small style="color: #00a884;" id="online-status">online</small>
                </div>
            </div>
            
            <div class="header-actions">
                <label for="wallpaper-input" class="icon-btn" style="color: #00a884; font-size: 20px; margin: 0;">🎨</label>
                <input type="file" id="wallpaper-input" hidden accept="image/*">
                
                <button class="icon-btn" id="startCallBtn" style="color: #00a884; font-size: 22px;">📹</button>
            </div>
        </div>

        <!-- Incoming Call Alert Overlay -->
        <div id="call-notification">
            <span id="caller-name">Incoming Call...</span>
            <div class="call-actions-btn">
                <button class="c-act c-accept" id="acceptCallBtn">Accept</button>
                <button class="c-act c-reject" id="rejectCallBtn">Reject</button>
            </div>
        </div>
        
        <div id="messages"></div>

        <!-- Mini Floating Video Window Inside Chat -->
        <div id="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div class="video-controls">
                <div class="control-row">
                    <button class="v-btn" id="toggleCamBtn" title="Switch Camera">🔄</button>
                    <button class="v-btn" id="muteMicBtn" title="Mute Mic">🎤</button>
                </div>
                <div class="control-row" style="justify-content: center;">
                    <button class="v-btn end-call" id="endCallBtn" title="End Call">📞</button>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <label for="file-input" class="icon-btn">📎</label>
            <input type="file" id="file-input" hidden accept="image/*">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button class="icon-btn" id="sendBtn" style="color: #00a884;">➤</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, update, remove, onValue, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
        authDomain: "galk-55f49.firebaseapp.com",
        projectId: "galk-55f49",
        storageBucket: "galk-55f49.firebasestorage.app",
        messagingSenderId: "1005825050326",
        appId: "1:1005825050326:web:fda4271183b4c4ff106b77"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myName, roomID;
    let localStream = null;
    let peerConnection = null;
    let currentFacingMode = "user"; 
    let isMuted = false;
    let currentCallData = null;

    const rtcConfig = { iceServers: [{ urls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }] };

    document.getElementById('loginBtn').onclick = () => {
        myName = document.getElementById('username').value.trim();
        roomID = document.getElementById('room-code').value.trim();

        if (myName && roomID) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            
            // User entry point set karna (Agar purani pfp h toh secure rhegi)
            const userStatusRef = ref(db, `chat_rooms/${roomID}_users/${myName}/online`);
            set(userStatusRef, true);
            onDisconnect(userStatusRef).remove();

            // 🔥 Real-time Users Tracker (Names + Profile Pics Dono Ke Liye)
            onValue(ref(db, `chat_rooms/${roomID}_users`), (snapshot) => {
                const users = snapshot.val();
                if (users) {
                    const namesArray = Object.keys(users);
                    document.getElementById('display-room').innerText = namesArray.join(' & ');
                    
                    // Room avatar logic fix: Agar kisi ne photo lagayi hai, toh avatar mein background set hoga
                    let pfpFound = null;
                    namesArray.forEach(userKey => {
                        if (users[userKey] && users[userKey].pfp) {
                            pfpFound = users[userKey].pfp; 
                        }
                    });

                    const avatarDiv = document.getElementById('room-avatar');
                    if (pfpFound) {
                        avatarDiv.style.backgroundImage = `url('${pfpFound}')`;
                        avatarDiv.innerText = ""; // Text gayab ho jayega image aane par
                    } else {
                        avatarDiv.style.backgroundImage = "none";
                        const firstUser = namesArray[0];
                        avatarDiv.innerText = firstUser ? firstUser[0].toUpperCase() : "💬";
                    }
                } else {
                    document.getElementById('display-room').innerText = myName;
                }
            });
            
            const messagesRef = ref(db, 'chat_rooms/' + roomID);
            
            onChildAdded(messagesRef, (snapshot) => {
                const msgID = snapshot.key;
                const data = snapshot.val();
                if (data.user !== myName && !data.seen) {
                    update(ref(db, `chat_rooms/${roomID}/${msgID}`), { seen: true });
                }
                renderMessage(msgID, data);
            });

            onChildChanged(messagesRef, (snapshot) => {
                const msgID = snapshot.key;
                const data = snapshot.val();
                if (data.seen) {
                    const tickElement = document.querySelector(`#msg-${msgID} .tick`);
                    if (tickElement) {
                        tickElement.classList.add('seen');
                        tickElement.innerText = '✔️✔️';
                    }
                    startDeleteTimer(msgID);
                }
            });

            onValue(ref(db, `chat_rooms/${roomID}_wallpaper`), (snapshot) => {
                const wallpaperData = snapshot.val();
                if (wallpaperData && wallpaperData.img) {
                    document.getElementById('messages').style.backgroundImage = `url('${wallpaperData.img}')`;
                }
            });

            listenForCallSignals();
        } else {
            alert("Please enter Name and Room Code!");
        }
    };

    // 🔥 PROFILE IMAGE CLICK AND UPLOAD LOGIC
    document.getElementById('room-avatar').onclick = () => {
        document.getElementById('profile-input').click();
    };

    document.getElementById('profile-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            // Profile image base64 text database ke user node pe store ho raha h
            update(ref(db, `chat_rooms/${roomID}_users/${myName}`), {
                pfp: event.target.result
            });
        };
        reader.readAsDataURL(file);
    };

    function onDisconnect(nodeRef) {
        return {
            remove: () => {
                window.addEventListener('beforeunload', () => remove(nodeRef));
            }
        }
    }

    document.getElementById('wallpaper-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            set(ref(db, `chat_rooms/${roomID}_wallpaper`), {
                img: event.target.result,
                changedBy: myName
            });
        };
        reader.readAsDataURL(file);
    };

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;
        push(ref(db, 'chat_rooms/' + roomID), {
            user: myName, content: text, type: 'text', seen: false,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        input.value = "";
    }
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            push(ref(db, 'chat_rooms/' + roomID), {
                user: myName, content: event.target.result, type: 'image', seen: false,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
        };
        reader.readAsDataURL(file);
    };

    function renderMessage(msgID, data) {
        const container = document.getElementById('messages');
        if (document.getElementById(`msg-${msgID}`)) return;

        const div = document.createElement('div');
        div.id = `msg-${msgID}`;
        const isMe = data.user === myName;
        div.className = `msg ${isMe ? 'sent' : 'received'}`;
        
        let htmlContent = data.type === 'text' ? `<span>${data.content}</span>` : `<img src="${data.content}">`;
        let tickHtml = isMe ? `<span class="tick ${data.seen ? 'seen' : ''}">${data.seen ? '✔️✔️' : '✔️'}</span>` : '';

        div.innerHTML = `<span class="msg-info">${isMe ? 'You' : data.user}</span>${htmlContent}<div class="msg-meta"><span>${data.time}</span>${tickHtml}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;

        if (data.seen || data.user !== myName) startDeleteTimer(msgID);
    }

    function startDeleteTimer(msgID) {
        setTimeout(() => {
            if (document.getElementById(`msg-${msgID}`)) document.getElementById(`msg-${msgID}`).remove();
            remove(ref(db, `chat_rooms/${roomID}/${msgID}`));
        }, 10000);
    }

    // FIXED VIDEO CALLING & SIGNALS LOGIC
    async function initMedia(facingMode) {
        if(localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
        localStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode },
            audio: true
        });
        document.getElementById('local-video').srcObject = localStream;
        if(isMuted) {
            localStream.getAudioTracks()[0].enabled = false;
        }
    }

    function createPeerConnection() {
        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
            const remoteVid = document.getElementById('remote-video');
            if (remoteVid.srcObject !== event.streams[0]) {
                remoteVid.srcObject = event.streams[0];
            }
        };

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                push(ref(db, `calls/${roomID}/iceCandidates`), event.candidate.toJSON());
            }
        };
    }

    async function makeCall() {
        await initMedia(currentFacingMode);
        document.getElementById('video-container').style.display = 'block';

        createPeerConnection();

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await set(ref(db, `calls/${roomID}`), {
            offer: { type: offer.type, sdp: offer.sdp },
            caller: myName,
            status: "ringing"
        });
    }

    function listenForCallSignals() {
        const callRef = ref(db, `calls/${roomID}`);
        
        onValue(callRef, async (snapshot) => {
            const data = snapshot.val();
            currentCallData = data;
            if (!data) return;

            if (data.offer && data.caller !== myName && data.status === "ringing") {
                document.getElementById('caller-name').innerText = `${data.caller} is calling...`;
                document.getElementById('call-notification').style.display = 'flex';
            }

            if (data.answer && data.caller === myName && data.status === "connected") {
                if (peerConnection && peerConnection.signalingState !== "stable") {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    
                    onChildAdded(ref(db, `calls/${roomID}/iceCandidates`), (snap) => {
                        const candidate = new RTCIceCandidate(snap.val());
                        peerConnection.addIceCandidate(candidate);
                    });
                }
            }
        });

        onValue(ref(db, `calls/${roomID}/ended`), (snapshot) => {
            if (snapshot.val() === true) closeCall();
        });
    }

    document.getElementById('acceptCallBtn').onclick = async () => {
        document.getElementById('call-notification').style.display = 'none';
        if (!currentCallData) return;

        await initMedia(currentFacingMode);
        document.getElementById('video-container').style.display = 'block';

        createPeerConnection();

        await peerConnection.setRemoteDescription(new RTCSessionDescription(currentCallData.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await update(ref(db, `calls/${roomID}`), {
            answer: { type: answer.type, sdp: answer.sdp },
            status: "connected"
        });

        onChildAdded(ref(db, `calls/${roomID}/iceCandidates`), (snap) => {
            const candidate = new RTCIceCandidate(snap.val());
            peerConnection.addIceCandidate(candidate);
        });
    };

    document.getElementById('rejectCallBtn').onclick = async () => {
        document.getElementById('call-notification').style.display = 'none';
        await set(ref(db, `calls/${roomID}/ended`), true);
        remove(ref(db, `calls/${roomID}`));
    };

    function closeCall() {
        document.getElementById('video-container').style.display = 'none';
        document.getElementById('call-notification').style.display = 'none';
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        if (peerConnection) peerConnection.close();
        localStream = null;
        peerConnection = null;
        document.getElementById('local-video').srcObject = null;
        document.getElementById('remote-video').srcObject = null;
    }

    document.getElementById('startCallBtn').onclick = makeCall;
    
    document.getElementById('endCallBtn').onclick = async () => {
        await set(ref(db, `calls/${roomID}/ended`), true);
        remove(ref(db, `calls/${roomID}`)); 
        closeCall();
    };

    document.getElementById('muteMicBtn').onclick = () => {
        isMuted = !isMuted;
        if(localStream) {
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('muteMicBtn').innerText = isMuted ? '🔇' : '🎤';
        }
    };

    document.getElementById('toggleCamBtn').onclick = async () => {
        currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
        await initMedia(currentFacingMode);
        if(peerConnection) {
            const videoTrack = localStream.getVideoTracks()[0];
            const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
            if(sender) sender.replaceTrack(videoTrack);
        }
    };

    // DRAGGABLE FLOATING WINDOW SYSTEM
    const videoCont = document.getElementById("video-container");
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

    videoCont.addEventListener("mousedown", dragStart);
    videoCont.addEventListener("touchstart", dragStart);
    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
    document.addEventListener("mouseup", dragEnd);
    document.addEventListener("touchend", dragEnd);

    function dragStart(e) {
        if (e.target.classList.contains('v-btn')) return; 
        let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
        let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
        initialX = clientX - xOffset;
        initialY = clientY - yOffset;
        isDragging = true;
    }
    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
            currentX = clientX - initialX;
            currentY = clientY - initialY;
            xOffset = currentX;
            yOffset = currentY;
            videoCont.style.transform = `translate(${currentX}px, ${currentY}px)`;
        }
    }
    function dragEnd() { isDragging = false; }
</script>
</body>
</html>
