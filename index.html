<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat | Ultra Secure & Fixed Call Protocol</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b141a; height: 100vh; display: flex; justify-content: center; align-items: center; -webkit-user-select: none; user-select: none; }
        
        #main-container { width: 100%; max-width: 450px; height: 95vh; background: #111b21; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid #222e35; position: relative; transition: filter 0.1s ease-in-out, opacity 0.1s ease-in-out; }
        
        .secure-blur { filter: blur(40px) brightness(0.05) !important; pointer-events: none !important; }
        .secure-hide { opacity: 0 !important; filter: brightness(0) !important; pointer-events: none !important; }

        /* Login */
        #login-box { padding: 40px; text-align: center; color: white; margin: auto; width: 100%; }
        #login-box h2 { color: #00a884; margin-bottom: 25px; font-size: 30px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; background: #2a3942; color: white; font-size: 16px; outline: none; }
        .btn-join { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00a884; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Chat UI */
        #chat-box { display: none; flex-direction: column; height: 100%; }
        .chat-header { padding: 15px; background: #202c33; color: white; display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; }
        .header-info { display: flex; align-items: center; gap: 12px; max-width: 70%; }
        
        #users-display-container { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .user-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .avatar { width: 26px; height: 26px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; flex-shrink: 0; cursor: pointer; overflow: hidden; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.2); }
        .header-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; display: flex; flex-direction: column; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; }

        #messages { flex-grow: 1; padding: 15px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-attachment: fixed; background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 8px; }

        .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 15px; position: relative; color: #e9edef; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        
        .system-alert { background: #ea0038 !important; color: white !important; align-self: center !important; text-align: center; font-size: 13px !important; border-radius: 8px !important; font-weight: bold; width: 90%; margin: 6px 0; box-shadow: 0 0 15px rgba(234,0,56,0.6); animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-6px);} 75% {transform: translateX(6px);} }

        .msg-info { font-size: 10px; display: block; margin-bottom: 3px; font-weight: bold; color: #34b7f1; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .msg audio { max-width: 100%; margin-top: 5px; display: block; outline: none; }
        
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 10px; opacity: 0.6; margin-top: 4px; }
        .tick { font-size: 12px; color: #8696a0; }
        .tick.seen { color: #34b7f1; }

        .input-bar { padding: 10px; background: #202c33; display: flex; align-items: center; gap: 8px; position: relative; }
        #msg-input { flex-grow: 1; background: #2a3942; padding: 12px 18px; border-radius: 25px; margin: 0; }
        .icon-btn { background: none; border: none; color: #8696a0; cursor: pointer; font-size: 24px; display: flex; align-items: center; transition: color 0.2s; }
        
        .recording-active { color: #ea0038 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* RESIZABLE & DRAGGABLE FLOATING CONTAINER */
        #video-container { display: none; position: absolute; top: 75px; right: 15px; width: 180px; height: 260px; min-width: 150px; min-height: 200px; max-width: 400px; max-height: 550px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 2px solid #00a884; z-index: 999; cursor: move; padding: 4px; resize: both; }
        #video-container::after { content: "◢"; position: absolute; bottom: 0; right: 2px; color: #00a884; font-size: 12px; font-weight: bold; pointer-events: none; cursor: se-resize; }

        #video-grid { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; height: 100%; justify-content: center; align-items: center; overflow-y: auto; }
        .video-box { position: relative; flex: 1 1 45%; min-width: 65px; height: 48%; background: #222; border-radius: 6px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 2px; left: 4px; background: rgba(0,0,0,0.6); color: white; font-size: 8px; padding: 1px 4px; border-radius: 3px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .video-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; opacity: 0; transition: opacity 0.3s; background: rgba(0,0,0,0.3); pointer-events: none; }
        #video-container:hover .video-controls { opacity: 1; }
        .control-row { display: flex; justify-content: space-between; width: 100%; pointer-events: auto; }
        .v-btn { background: rgba(32, 44, 51, 0.9); border: none; color: white; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .v-btn.end-call { background: #ea0038; }

        /* ABSOLUTE TOP HEADER CALL PANEL BAR overlay */
        #call-notification { display: none; position: absolute; top: 0; left: 0; width: 100%; background: #00a884; padding: 12px 20px; z-index: 10000; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; font-weight: bold; animation: slideDown 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        .call-actions-btn { display: flex; gap: 10px; }
        .c-act { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .c-accept { background: #fff; color: #00a884; }
        .c-reject { background: #ea0038; color: white; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="login-box">
        <h2>VIBE CHAT</h2>
        <input type="text" id="username" placeholder="Apna Naam Likho">
        <input type="text" id="room-code" placeholder="Enter Room Code">
        <button class="btn-join" id="loginBtn">JOIN NOW</button>
    </div>

    <div id="chat-box">
        <div id="call-notification">
            <span id="caller-name">Incoming Call...</span>
            <div class="call-actions-btn">
                <button class="c-act c-accept" id="acceptCallBtn">Accept</button>
                <button class="c-act c-reject" id="rejectCallBtn">Reject</button>
            </div>
        </div>

        <div class="chat-header">
            <div class="header-info">
                <input type="file" id="profile-input" hidden accept="image/*">
                <div class="header-text">
                    <div id="users-display-container">Connecting Users...</div>
                    <small style="color: #00a884; margin-top: 2px;" id="online-status">online</small>
                </div>
            </div>
            
            <div class="header-actions">
                <label for="wallpaper-input" class="icon-btn" style="color: #00a884; font-size: 20px; margin: 0;">🎨</label>
                <input type="file" id="wallpaper-input" hidden accept="image/*">
                <button class="icon-btn" id="startCallBtn" style="color: #00a884; font-size: 22px;">📹</button>
            </div>
        </div>
        
        <div id="messages"></div>

        <div id="video-container">
            <div id="video-grid"></div>
            <div class="video-controls">
                <div class="control-row">
                    <button class="v-btn" id="toggleCamBtn">🔄</button>
                    <button class="v-btn" id="muteMicBtn">🎤</button>
                </div>
                <div class="control-row" style="justify-content: center;">
                    <button class="v-btn end-call" id="endCallBtn">📞</button>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <label for="file-input" class="icon-btn">📎</label>
            <input type="file" id="file-input" hidden accept="image/*">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button class="icon-btn" id="voiceBtn" style="margin-right: 5px;">🎙️</button>
            <button class="icon-btn" id="sendBtn" style="color: #00a884;">➤</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, update, remove, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
        authDomain: "galk-55f49.firebaseapp.com",
        projectId: "galk-55f49",
        storageBucket: "galk-55f49.firebasestorage.app",
        messagingSenderId: "1005825050326",
        appId: "1:1005825050326:web:fda4271183b4c4ff106b77"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myName, roomID;
    let localStream = null;
    let peerConnections = {}; 
    let currentFacingMode = "user"; 
    let isMuted = false;
    let lastAlertTime = 0;

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const rtcConfig = { iceServers: [{ urls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }] };

    document.getElementById('loginBtn').onclick = () => {
        myName = document.getElementById('username').value.trim();
        roomID = document.getElementById('room-code').value.trim();

        if (myName && roomID) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            
            const userStatusRef = ref(db, `chat_rooms/${roomID}_users/${myName}`);
            set(ref(db, `chat_rooms/${roomID}_users/${myName}/online`), true);
            onDisconnect(userStatusRef).remove();
            
            window.addEventListener('beforeunload', () => {
                closeAllCalls();
                remove(userStatusRef);
            });

            setupHardenedSecurity();
            setupVoiceMessageEngine();

            onValue(ref(db, `chat_rooms/${roomID}_users`), (snapshot) => {
                const users = snapshot.val();
                const container = document.getElementById('users-display-container');
                container.innerHTML = ""; 

                if (users) {
                    Object.keys(users).forEach(userKey => {
                        const userRow = document.createElement('div');
                        userRow.className = 'user-row';
                        const avatarDiv = document.createElement('div');
                        avatarDiv.className = 'avatar';
                        
                        if(userKey === myName) {
                            avatarDiv.onclick = () => document.getElementById('profile-input').click();
                        }

                        if (users[userKey] && users[userKey].pfp) {
                            avatarDiv.style.backgroundImage = `url('${users[userKey].pfp}')`;
                            avatarDiv.innerText = "";
                        } else {
                            avatarDiv.style.backgroundImage = "none";
                            avatarDiv.innerText = userKey[0].toUpperCase();
                        }

                        const nameSpan = document.createElement('strong');
                        nameSpan.innerText = userKey === myName ? `${userKey} (You)` : userKey;

                        userRow.appendChild(avatarDiv);
                        userRow.appendChild(nameSpan);
                        container.appendChild(userRow);
                    });
                }
            });
            
            const messagesRef = ref(db, 'chat_rooms/' + roomID);
            onChildAdded(messagesRef, (snapshot) => {
                const msgID = snapshot.key;
                const data = snapshot.val();
                if (data.user !== myName && !data.seen && data.type !== 'alert') {
                    update(ref(db, `chat_rooms/${roomID}/${msgID}`), { seen: true });
                }
                renderMessage(msgID, data);
            });

            onChildChanged(messagesRef, (snapshot) => {
                const msgID = snapshot.key;
                const data = snapshot.val();
                if (data.seen && data.type !== 'alert') {
                    const tickElement = document.querySelector(`#msg-${msgID} .tick`);
                    if (tickElement) {
                        tickElement.classList.add('seen');
                        tickElement.innerText = '✔️✔️';
                    }
                    startDeleteTimer(msgID);
                }
            });

            onValue(ref(db, `chat_rooms/${roomID}_wallpaper`), (snapshot) => {
                const wallpaperData = snapshot.val();
                if (wallpaperData && wallpaperData.img) {
                    document.getElementById('messages').style.backgroundImage = `url('${wallpaperData.img}')`;
                }
            });

            listenForGroupCallSignals();
        } else {
            alert("Please enter Name and Room Code!");
        }
    };

    function setupHardenedSecurity() {
        const container = document.getElementById("main-container");
        const lockUI = () => { container.classList.add("secure-blur"); triggerDatabaseAlert(); };
        const unlockUI = () => setTimeout(() => container.classList.remove("secure-blur"), 800);

        document.addEventListener("touchstart", (e) => {
            if (e.touches.length >= 3) { container.classList.add("secure-hide"); triggerDatabaseAlert(); }
        }, { passive: false });
        document.addEventListener("touchend", () => { setTimeout(() => container.classList.remove("secure-hide"), 1000); });

        document.addEventListener("visibilitychange", () => { if (document.hidden) lockUI(); else unlockUI(); });
        window.addEventListener("blur", lockUI);
        window.addEventListener("focus", unlockUI);

        document.addEventListener("keyup", (e) => {
            if (e.key === "PrintScreen" || e.keyCode === 44) {
                navigator.clipboard.writeText("🚫 Content Protected!");
                triggerDatabaseAlert();
            }
        });
        document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey && e.key === "p") || (e.metaKey && e.shiftKey && e.key === "s") || (e.ctrlKey && e.key === "s")) {
                e.preventDefault();
                triggerDatabaseAlert();
            }
        });
    }

    function triggerDatabaseAlert() {
        let now = Date.now();
        if (now - lastAlertTime < 5000) return;
        lastAlertTime = now;
        push(ref(db, 'chat_rooms/' + roomID), {
            user: myName, content: `🚫 Alert: ${myName} ne screenshot / 3-finger gesture ki koshish ki!`,
            type: 'alert', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
    }

    function setupVoiceMessageEngine() {
        const voiceBtn = document.getElementById('voiceBtn');
        voiceBtn.onclick = async () => {
            if (!isRecording) {
                audioChunks = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            push(ref(db, 'chat_rooms/' + roomID), {
                                user: myName, content: reader.result, type: 'audio', seen: false,
                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            });
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('recording-active');
                } catch (err) {
                    alert("Microphone Access Denied!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording-active');
            }
        };
    }

    document.getElementById('profile-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => { update(ref(db, `chat_rooms/${roomID}_users/${myName}`), { pfp: event.target.result }); };
        reader.readAsDataURL(file);
    };

    document.getElementById('wallpaper-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => { set(ref(db, `chat_rooms/${roomID}_wallpaper`), { img: event.target.result, changedBy: myName }); };
        reader.readAsDataURL(file);
    };

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;
        push(ref(db, 'chat_rooms/' + roomID), {
            user: myName, content: text, type: 'text', seen: false,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        input.value = "";
    }
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            push(ref(db, 'chat_rooms/' + roomID), {
                user: myName, content: event.target.result, type: 'image', seen: false,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
        };
        reader.readAsDataURL(file);
    };

    function renderMessage(msgID, data) {
        const container = document.getElementById('messages');
        if (document.getElementById(`msg-${msgID}`)) return;
        const div = document.createElement('div');
        div.id = `msg-${msgID}`;
        
        if(data.type === 'alert') {
            div.className = "msg system-alert";
            div.innerHTML = `<span>${data.content}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            setTimeout(() => div.remove(), 7000); 
            return;
        }

        const isMe = data.user === myName;
        div.className = `msg ${isMe ? 'sent' : 'received'}`;
        
        let htmlContent = "";
        if(data.type === 'text') htmlContent = `<span>${data.content}</span>`;
        else if(data.type === 'image') htmlContent = `<img src="${data.content}">`;
        else if(data.type === 'audio') htmlContent = `<audio src="${data.content}" controls></audio>`;

        let tickHtml = isMe ? `<span class="tick ${data.seen ? 'seen' : ''}">${data.seen ? '✔️✔️' : '✔️'}</span>` : '';
        div.innerHTML = `<span class="msg-info">${isMe ? 'You' : data.user}</span>${htmlContent}<div class="msg-meta"><span>${data.time}</span>${tickHtml}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        if (data.seen || data.user !== myName) startDeleteTimer(msgID);
    }

    function startDeleteTimer(msgID) {
        setTimeout(() => {
            const el = document.getElementById(`msg-${msgID}`);
            if (el) el.remove();
            remove(ref(db, `chat_rooms/${roomID}/${msgID}`));
        }, 10000);
    }

    // 📹 RE-ARCHITECTED CALL ROUTING STACK (HEADER FIXED)
    async function initMedia() {
        if (!localStream) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
                addVideoBox(myName, localStream, true);
            } catch (e) {
                alert("Camera ya Microphone permission required!");
            }
        }
    }

    function addVideoBox(id, stream, isLocal = false) {
        if(document.getElementById(`vid-box-${id}`)) return;
        const grid = document.getElementById('video-grid');
        const box = document.createElement('div');
        box.className = 'video-box';
        box.id = `vid-box-${id}`;

        const video = document.createElement('video');
        video.autoplay = true;
        video.playsinline = true;
        if(isLocal) video.muted = true;
        video.srcObject = stream;

        const label = document.createElement('div');
        label.className = 'video-label';
        label.innerText = isLocal ? "You" : id;

        box.appendChild(video);
        box.appendChild(label);
        grid.appendChild(box);
    }

    async function startGroupCall() {
        await initMedia();
        document.getElementById('video-container').style.display = 'block';
        
        // Pure active logic node reset kiya block state bypass ke liye
        set(ref(db, `group_calls/${roomID}/call_active`), { 
            initiator: myName, 
            status: "ringing",
            timeToken: Date.now() 
        });
    }

    function listenForGroupCallSignals() {
        // Dedicated Root Level Header Monitor Listener
        onValue(ref(db, `group_calls/${roomID}/call_active`), async (snapshot) => {
            const state = snapshot.val();
            if (state && state.status === "ringing") {
                if (state.initiator !== myName) {
                    document.getElementById('caller-name').innerText = `📹 Incoming Call from: ${state.initiator}`;
                    document.getElementById('call-notification').style.display = 'flex';
                }
            } else {
                document.getElementById('call-notification').style.display = 'none';
            }
        });

        // Dedicated Node Matrix signaling channels filter
        onChildAdded(ref(db, `group_calls/${roomID}/signals/${myName}`), async (snapshot) => {
            const data = snapshot.val();
            const sender = snapshot.key;
            if (!data) return;

            if (data.type === "offer") {
                await setupPeerConnection(sender, false);
                await peerConnections[sender].setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnections[sender].createAnswer();
                await peerConnections[sender].setLocalDescription(answer);
                set(ref(db, `group_calls/${roomID}/signals/${sender}/${myName}`), { type: "answer", answer: answer });
            } else if (data.type === "answer") {
                if (peerConnections[sender]) {
                    await peerConnections[sender].setRemoteDescription(new RTCSessionDescription(data.answer));
                }
            } else if (data.type === "ice") {
                if (peerConnections[sender] && data.candidate) {
                    await peerConnections[sender].addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        });

        onChildAdded(ref(db, `group_calls/${roomID}/leave`), (snapshot) => {
            const leftUser = snapshot.val();
            if (leftUser && leftUser !== myName) removeUserFromCall(leftUser);
        });
    }

    async function setupPeerConnection(remoteUser, isInitiator) {
        if (peerConnections[remoteUser]) return;

        const pc = new RTCPeerConnection(rtcConfig);
        peerConnections[remoteUser] = pc;

        if (localStream) {
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        pc.ontrack = (event) => { addVideoBox(remoteUser, event.streams[0]); };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                set(ref(db, `group_calls/${roomID}/signals/${remoteUser}/${myName}/ice`), { candidate: event.candidate.toJSON() });
            }
        };

        if (isInitiator) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            set(ref(db, `group_calls/${roomID}/signals/${remoteUser}/${myName}`), { type: "offer", offer: offer });
        }
    }

    document.getElementById('acceptCallBtn').onclick = async () => {
        document.getElementById('call-notification').style.display = 'none';
        await initMedia();
        document.getElementById('video-container').style.display = 'block';

        // Online mesh mapping instantly sync
        onValue(ref(db, `chat_rooms/${roomID}_users`), (snapshot) => {
            const users = snapshot.val();
            if(users) {
                Object.keys(users).forEach(userKey => {
                    if (userKey !== myName) {
                        setupPeerConnection(userKey, true); 
                    }
                });
            }
        }, { onlyOnce: true });
    };

    document.getElementById('rejectCallBtn').onclick = () => {
        document.getElementById('call-notification').style.display = 'none';
    };

    function removeUserFromCall(user) {
        if (peerConnections[user]) { peerConnections[user].close(); delete peerConnections[user]; }
        const box = document.getElementById(`vid-box-${user}`);
        if (box) box.remove();
    }

    function closeAllCalls() {
        document.getElementById('video-container').style.display = 'none';
        document.getElementById('call-notification').style.display = 'none';
        
        push(ref(db, `group_calls/${roomID}/leave`), myName);
        remove(ref(db, `group_calls/${roomID}/signals/${myName}`));
        set(ref(db, `group_calls/${roomID}/call_active`), null);

        if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
        Object.keys(peerConnections).forEach(user => { peerConnections[user].close(); });
        peerConnections = {};
        document.getElementById('video-grid').innerHTML = "";
    }

    document.getElementById('startCallBtn').onclick = startGroupCall;
    document.getElementById('endCallBtn').onclick = closeAllCalls;

    document.getElementById('muteMicBtn').onclick = () => {
        isMuted = !isMuted;
        if(localStream) { localStream.getAudioTracks()[0].enabled = !isMuted; document.getElementById('muteMicBtn').innerText = isMuted ? '🔇' : '🎤'; }
    };

    document.getElementById('toggleCamBtn').onclick = async () => {
        currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
        if(localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
            document.getElementById(`vid-box-${myName}`).querySelector('video').srcObject = localStream;
            Object.keys(peerConnections).forEach(user => {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = peerConnections[user].getSenders().find(s => s.track.kind === 'video');
                if(sender) sender.replaceTrack(videoTrack);
            });
        }
    };

    // FLOATING CONTAINER DRAG HANDLERS
    const videoCont = document.getElementById("video-container");
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

    videoCont.addEventListener("mousedown", dragStart);
    videoCont.addEventListener("touchstart", dragStart);
    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
    document.addEventListener("mouseup", dragEnd);
    document.addEventListener("touchend", dragEnd);

    function dragStart(e) {
        if (e.target.classList.contains('v-btn') || e.target.tagName === 'VIDEO' || (e.offsetX > videoCont.clientWidth - 15 && e.offsetY > videoCont.clientHeight - 15)) return; 
        let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
        let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
        initialX = clientX - xOffset; initialY = clientY - yOffset;
        isDragging = true;
    }
    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
            currentX = clientX - initialX; currentY = clientY - initialY;
            xOffset = currentX; yOffset = currentY;
            videoCont.style.transform = `translate(${currentX}px, ${currentY}px)`;
        }
    }
    function dragEnd() { isDragging = false; }
</script>
</body>
</html>
