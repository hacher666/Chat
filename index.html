<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat | Clean</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b141a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #main-container { width: 100%; max-width: 400px; height: 90vh; background: #111b21; display: flex; flex-direction: column; border-radius: 20px; border: 1px solid #2a3942; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

        /* Header */
        .chat-header { padding: 15px 20px; background: #202c33; color: white; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3942; }
        .user-badge { background: #00a884; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        
        /* Messages */
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; color: #e9edef; font-size: 14px; }
        .sent { background: #005c4b; align-self: flex-end; }
        .received { background: #202c33; align-self: flex-start; }

        /* Updated Input Bar */
        .input-bar { padding: 10px 15px; background: #202c33; display: flex; align-items: center; gap: 10px; }
        #micBtn { background: #2a3942; border: none; color: #00a884; padding: 10px; border-radius: 50%; cursor: pointer; }
        #msg-input { flex-grow: 1; padding: 10px 15px; border-radius: 20px; border: none; background: #2a3942; color: white; outline: none; }
        #sendBtn { background: transparent; border: none; color: #00a884; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="login-box" style="padding: 40px; color: white; text-align: center; margin: auto;">
        <h2>VIBE CHAT</h2>
        <input type="text" id="username" placeholder="Name" style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:none;">
        <input type="text" id="room-code" placeholder="Room" style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:none;">
        <button id="loginBtn" style="width:100%; padding:10px; background:#00a884; border:none; color:white; border-radius:8px; cursor:pointer;">JOIN</button>
    </div>

    <div id="chat-box" style="display: none; flex-direction: column; height: 100%;">
        <div class="chat-header">
            <strong>Vibe Chat</strong>
            <span id="display-user" class="user-badge">Guest</span>
        </div>

        <div id="messages"></div>

        <div class="input-bar">
            <button id="micBtn">🎤</button>
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
        authDomain: "galk-55f49.firebaseapp.com",
        projectId: "galk-55f49",
        storageBucket: "galk-55f49.firebasestorage.app",
        messagingSenderId: "1005825050326",
        appId: "1:1005825050326:web:fda4271183b4c4ff106b77",
        measurementId: "G-32CW801HFV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myName, roomID;
    
    document.getElementById('loginBtn').onclick = () => {
        myName = document.getElementById('username').value.trim();
        roomID = document.getElementById('room-code').value.trim();
        if(!myName || !roomID) return alert("Fill fields!");
        
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('chat-box').style.display = 'flex';
        document.getElementById('display-user').innerText = myName;

        onChildAdded(ref(db, 'rooms/' + roomID), (snap) => {
            const msgID = snap.key;
            const data = snap.val();
            const div = document.createElement('div');
            div.id = `msg-${msgID}`;
            div.className = `msg ${data.user === myName ? 'sent' : 'received'}`;
            // Added Username label above msg
            div.innerHTML = `<small style="display:block; font-size:9px; opacity:0.7;">${data.user}</small>` + 
                            (data.type === 'audio' ? `<audio controls src="${data.content}"></audio>` : `<span>${data.content}</span>`);
            document.getElementById('messages').appendChild(div);

            setTimeout(() => {
                if(document.getElementById(`msg-${msgID}`)) document.getElementById(`msg-${msgID}`).remove();
                remove(ref(db, `rooms/${roomID}/${msgID}`));
            }, 10000);
        });
    };

    document.getElementById('sendBtn').onclick = () => {
        const input = document.getElementById('msg-input');
        if(!input.value) return;
        push(ref(db, 'rooms/' + roomID), { user: myName, content: input.value, type: 'text' });
        input.value = "";
    };
</script>
</body>
</html>
