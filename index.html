<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat | Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b141a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* 🔥 High Security: Screenshot context hide karne ke liye main block style */
        #main-container { width: 100%; max-width: 450px; height: 95vh; background: #111b21; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid #222e35; position: relative; transition: filter 0.1s ease-in-out; }
        
        /* Jab user focus lose kare (Screenshot state) toh screen lock/blur style */
        .secure-blur { filter: blur(25px) brightness(0.2) !important; pointer-events: none; }

        /* Login */
        #login-box { padding: 40px; text-align: center; color: white; margin: auto; width: 100%; }
        #login-box h2 { color: #00a884; margin-bottom: 25px; font-size: 30px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; background: #2a3942; color: white; font-size: 16px; outline: none; }
        .btn-join { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00a884; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Chat UI */
        #chat-box { display: none; flex-direction: column; height: 100%; }
        .chat-header { padding: 15px; background: #202c33; color: white; display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; }
        .header-info { display: flex; align-items: center; gap: 12px; max-width: 70%; }
        
        /* Individual Users Display Header */
        #users-display-container { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .user-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .avatar { width: 26px; height: 26px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; flex-shrink: 0; cursor: pointer; overflow: hidden; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.2); }
        .header-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; display: flex; flex-direction: column; }
        
        /* Action Buttons on Header */
        .header-actions { display: flex; align-items: center; gap: 15px; }

        /* Wallpaper Background */
        #messages { flex-grow: 1; padding: 15px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-attachment: fixed; background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 8px; transition: background 0.5s ease-in-out; }

        .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 15px; position: relative; color: #e9edef; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        
        /* 🔥 Security System Alert Message Style */
        .system-alert { background: #ea0038 !important; color: white !important; align-self: center !important; text-align: center; font-size: 13px !important; border-radius: 8px !important; font-weight: bold; width: 90%; border-top-left-radius: 8px !important; box-shadow: 0 0 10px rgba(234,0,56,0.4); animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        .msg-info { font-size: 10px; display: block; margin-bottom: 3px; font-weight: bold; color: #34b7f1; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }

        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 10px; opacity: 0.6; margin-top: 4px; }
        .tick { font-size: 12px; color: #8696a0; }
        .tick.seen { color: #34b7f1; }

        .input-bar { padding: 10px; background: #202c33; display: flex; align-items: center; gap: 8px; }
        #msg-input { flex-grow: 1; background: #2a3942; padding: 12px 18px; border-radius: 25px; margin: 0; }
        .icon-btn { background: none; border: none; color: #8696a0; cursor: pointer; font-size: 24px; display: flex; align-items: center; }

        /* Floating Multi-User Container Style */
        #video-container { display: none; position: absolute; top: 75px; right: 15px; width: 160px; height: 240px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 2px solid #00a884; z-index: 999; cursor: move; padding: 4px; transition: width 0.3s, height 0.3s; }
        
        /* Dynamic Grid Inside Floating Box */
        #video-grid { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; height: 100%; justify-content: center; align-items: center; }
        .video-box { position: relative; flex: 1 1 45%; min-width: 65px; height: 100%; background: #222; border-radius: 6px; overflow: hidden; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 2px; left: 4px; background: rgba(0,0,0,0.6); color: white; font-size: 8px; padding: 1px 4px; border-radius: 3px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .multi-call { width: 260px !important; height: 360px !important; }
        .multi-call .video-box { height: 48% !important; }

        .video-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; opacity: 0; transition: opacity 0.3s; background: rgba(0,0,0,0.2); pointer-events: none; }
        #video-container:hover .video-controls { opacity: 1; }
        .control-row { display: flex; justify-content: space-between; width: 100%; pointer-events: auto; }
        .v-btn { background: rgba(32, 44, 51, 0.9); border: none; color: white; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .v-btn.end-call { background: #ea0038; }

        /* Call Notification Bar Layout */
        #call-notification { display: none; position: absolute; top: 65px; left: 5%; width: 90%; background: #202c33; padding: 10px 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; justify-content: space-between; align-items: center; color: white; border: 1px solid #00a884; }
        .call-actions-btn { display: flex; gap: 10px; }
        .c-act { padding: 6px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .c-accept { background: #00a884; }
        .c-reject { background: #ea0038; }
    </style>
</head>
<body>

<div id="main-container">
    <!-- Login Screen -->
    <div id="login-box">
        <h2>VIBE CHAT</h2>
        <input type="text" id="username" placeholder="Apna Naam Likho">
        <input type="text" id="room-code" placeholder="Enter Room Code">
        <button class="btn-join" id="loginBtn">JOIN NOW</button>
    </div>

    <!-- Chat Window Screen -->
    <div id="chat-box">
        <div class="chat-header">
            <div class="header-info">
                <input type="file" id="profile-input" hidden accept="image/*">
                <div class="header-text">
                    <div id="users-display-container">Connecting Users...</div>
                    <small style="color: #00a884; margin-top: 2px;" id="online-status">online</small>
                </div>
            </div>
            
            <div class="header-actions">
                <label for="wallpaper-input" class="icon-btn" style="color: #00a884; font-size: 20px; margin: 0;">🎨</label>
                <input type="file" id="wallpaper-input" hidden accept="image/*">
                
                <button class="icon-btn" id="startCallBtn" style="color: #00a884; font-size: 22px;">📹</button>
            </div>
        </div>

        <!-- Incoming Call Alert Overlay -->
        <div id="call-notification">
            <span id="caller-name">Incoming Call...</span>
            <div class="call-actions-btn">
                <button class="c-act c-accept" id="acceptCallBtn">Accept</button>
                <button class="c-act c-reject" id="rejectCallBtn">Reject</button>
            </div>
        </div>
        
        <div id="messages"></div>

        <!-- Floating Multi-User Container -->
        <div id="video-container">
            <div id="video-grid"></div>
            <div class="video-controls">
                <div class="control-row">
                    <button class="v-btn" id="toggleCamBtn" title="Switch Camera">🔄</button>
                    <button class="v-btn" id="muteMicBtn" title="Mute Mic">🎤</button>
                </div>
                <div class="control-row" style="justify-content: center;">
                    <button class="v-btn end-call" id="endCallBtn" title="End Call">📞</button>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <label for="file-input" class="icon-btn">📎</label>
            <input type="file" id="file-input" hidden accept="image/*">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button class="icon-btn" id="sendBtn" style="color: #00a884;">➤</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, update, remove, onValue, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
        authDomain: "galk-55f49.firebaseapp.com",
        projectId: "galk-55f49",
        storageBucket: "galk-55f49.firebasestorage.app",
        messagingSenderId: "1005825050326",
        appId: "1:1005825050326:web:fda4271183b4c4ff106b77"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myName, roomID;
    let localStream = null;
    let peerConnections = {}; 
    let currentFacingMode = "user"; 
    let isMuted = false;

    const rtcConfig = { iceServers: [{ urls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }] };

    document.getElementById('loginBtn').onclick = () => {
        myName = document.getElementById('username').value.trim();
        roomID = document.getElementById('room-code').value.trim();

        if (myName && roomID) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';
            
            const userStatusRef = ref(db, `chat_rooms/${roomID}_users/${myName}/online`);
            set(userStatusRef, true);
            onDisconnect(userStatusRef).remove();

            // Setup security triggers for screenshots after login
            setupScreenshotProtection();

            onValue(ref(db, `chat_rooms/${roomID}_users`), (snapshot) => {
                const users = snapshot.val();
                const container = document.getElementById('users-display-container');
                container.innerHTML = ""; 

                if (users) {
                    Object.keys(users).forEach(userKey => {
                        const userRow = document.createElement('div');
                        userRow.className = 'user-row';

                        const avatarDiv = document.createElement('div');
                        avatarDiv.className = 'avatar';
                        
                        if(userKey === myName) {
                            avatarDiv.onclick = () => document.getElementById('profile-input').click();
                        }

                        if (users[userKey] && users[userKey].pfp) {
                            avatarDiv.style.backgroundImage = `url('${users[userKey].pfp}')`;
                            avatarDiv.innerText = "";
                        } else {
                            avatarDiv.style.backgroundImage = "none";
                            avatarDiv.innerText = userKey[0].toUpperCase();
                        }

                        const nameSpan = document.createElement('strong');
                        nameSpan.innerText = userKey === myName ? `${userKey} (You)` : userKey;

                        userRow.appendChild(avatarDiv);
                        userRow.appendChild(nameSpan);
                        container.appendChild(userRow);
                    });
                } else {
                    container.innerText = myName;
                }
            });
            
            const messagesRef = ref(db, 'chat_rooms/' + roomID);
            
            onChildAdded(messagesRef, (snapshot) => {
                const msgID = snapshot.key;
                const data = snapshot.val();
                if (data.user !== myName && !data.seen && data.type !== 'alert') {
                    update(ref(db, `chat_rooms/${roomID}/${msgID}`), { seen: true });
                }
                renderMessage(msgID, data);
            });

            onChildChanged(messagesRef, (snapshot) => {
                const msgID = snapshot.key;
                const data = snapshot.val();
                if (data.seen && data.type !== 'alert') {
                    const tickElement = document.querySelector(`#msg-${msgID} .tick`);
                    if (tickElement) {
                        tickElement.classList.add('seen');
                        tickElement.innerText = '✔️✔️';
                    }
                    startDeleteTimer(msgID);
                }
            });

            onValue(ref(db, `chat_rooms/${roomID}_wallpaper`), (snapshot) => {
                const wallpaperData = snapshot.val();
                if (wallpaperData && wallpaperData.img) {
                    document.getElementById('messages').style.backgroundImage = `url('${wallpaperData.img}')`;
                }
            });

            listenForGroupCallSignals();
        } else {
            alert("Please enter Name and Room Code!");
        }
    };

    // 🔥 SCREENSHOT PROTECTION AND NOTIFICATION LOGIC
    function setupScreenshotProtection() {
        // 1. Mobile & Background Change Detection (Page ko black out blur karne ke liye)
        document.addEventListener("visibilitychange", () => {
            const container = document.getElementById("main-container");
            if (document.hidden) {
                container.classList.add("secure-blur");
                sendScreenshotAlertSignal(); // Alert on database
            } else {
                setTimeout(() => container.classList.remove("secure-blur"), 600);
            }
        });

        window.addEventListener("blur", () => {
            document.getElementById("main-container").classList.add("secure-blur");
            sendScreenshotAlertSignal();
        });

        window.addEventListener("focus", () => {
            setTimeout(() => document.getElementById("main-container").classList.remove("secure-blur"), 600);
        });

        // 2. PC Key Shortcuts Block & Trigger Alert (PrintScreen, Ctrl+P, Windows Key combinations)
        document.addEventListener("keydown", (e) => {
            if (e.key === "PrintScreen" || (e.ctrlKey && e.key === "p") || (e.metaKey && e.shiftKey && e.key === "s")) {
                e.preventDefault();
                sendScreenshotAlertSignal();
                alert("Security Alert: Screenshots or Printing is strictly prohibited!");
            }
        });
    }

    function sendScreenshotAlertSignal() {
        if (!roomID || !myName) return;
        push(ref(db, 'chat_rooms/' + roomID), {
            user: myName,
            content: `⚠️ Warning: ${myName} ne screenshot lene ki koshish ki!`,
            type: 'alert',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
    }

    document.getElementById('profile-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            update(ref(db, `chat_rooms/${roomID}_users/${myName}`), { pfp: event.target.result });
        };
        reader.readAsDataURL(file);
    };

    function onDisconnect(nodeRef) {
        return { remove: () => { window.addEventListener('beforeunload', () => remove(nodeRef)); } }
    }

    document.getElementById('wallpaper-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            set(ref(db, `chat_rooms/${roomID}_wallpaper`), { img: event.target.result, changedBy: myName });
        };
        reader.readAsDataURL(file);
    };

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;
        push(ref(db, 'chat_rooms/' + roomID), {
            user: myName, content: text, type: 'text', seen: false,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        input.value = "";
    }
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            push(ref(db, 'chat_rooms/' + roomID), {
                user: myName, content: event.target.result, type: 'image', seen: false,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
        };
        reader.readAsDataURL(file);
    };

    function renderMessage(msgID, data) {
        const container = document.getElementById('messages');
        if (document.getElementById(`msg-${msgID}`)) return;

        const div = document.createElement('div');
        div.id = `msg-${msgID}`;
        
        // Handle Security Alerts differently
        if(data.type === 'alert') {
            div.className = "msg system-alert";
            div.innerHTML = `<span>${data.content}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            
            // System alerts automatically vanish after 8 seconds
            setTimeout(() => div.remove(), 8000);
            return;
        }

        const isMe = data.user === myName;
        div.className = `msg ${isMe ? 'sent' : 'received'}`;
        
        let htmlContent = data.type === 'text' ? `<span>${data.content}</span>` : `<img src="${data.content}">`;
        let tickHtml = isMe ? `<span class="tick ${data.seen ? 'seen' : ''}">${data.seen ? '✔️✔️' : '✔️'}</span>` : '';

        div.innerHTML = `<span class="msg-info">${isMe ? 'You' : data.user}</span>${htmlContent}<div class="msg-meta"><span>${data.time}</span>${tickHtml}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;

        if (data.seen || data.user !== myName) startDeleteTimer(msgID);
    }

    function startDeleteTimer(msgID) {
        setTimeout(() => {
            const el = document.getElementById(`msg-${msgID}`);
            if (el) el.remove();
            remove(ref(db, `chat_rooms/${roomID}/${msgID}`));
        }, 10000);
    }

    // FLOATING CONTAINER & RTC CONTROL LOGIC
    async function initMedia() {
        if (!localStream) {
            localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
            addVideoBox(myName, localStream, true);
        }
    }

    function addVideoBox(id, stream, isLocal = false) {
        if(document.getElementById(`vid-box-${id}`)) return;
        
        const grid = document.getElementById('video-grid');
        const box = document.createElement('div');
        box.className = 'video-box';
        box.id = `vid-box-${id}`;

        const video = document.createElement('video');
        video.autoplay = true;
        video.playsinline = true;
        if(isLocal) video.muted = true;
        video.srcObject = stream;

        const label = document.createElement('div');
        label.className = 'video-label';
        label.innerText = isLocal ? "You" : id;

        box.appendChild(video);
        box.appendChild(label);
        grid.appendChild(box);

        const totalUsers = grid.children.length;
        const container = document.getElementById('video-container');
        if(totalUsers > 1) {
            container.classList.add('multi-call');
        } else {
            container.classList.remove('multi-call');
        }
    }

    async function startGroupCall() {
        await initMedia();
        document.getElementById('video-container').style.display = 'block';
        
        const signalRef = push(ref(db, `group_calls/${roomID}/signals`));
        set(signalRef, { type: "join-request", sender: myName });
    }

    function listenForGroupCallSignals() {
        onChildAdded(ref(db, `group_calls/${roomID}/signals`), async (snapshot) => {
            const data = snapshot.val();
            if(!data || data.sender === myName) return;

            if (data.type === "join-request") {
                if(!localStream) {
                    document.getElementById('caller-name').innerText = `${data.sender} is calling...`;
                    document.getElementById('call-notification').style.display = 'flex';
                } else {
                    setupPeerConnection(data.sender, true);
                }
            } else if (data.type === "offer" && data.target === myName) {
                await setupPeerConnection(data.sender, false);
                await peerConnections[data.sender].setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnections[data.sender].createAnswer();
                await peerConnections[data.sender].setLocalDescription(answer);
                
                push(ref(db, `group_calls/${roomID}/signals`), {
                    type: "answer", sender: myName, target: data.sender, answer: answer
                });
            } else if (data.type === "answer" && data.target === myName) {
                if(peerConnections[data.sender]) {
                    await peerConnections[data.sender].setRemoteDescription(new RTCSessionDescription(data.answer));
                }
            } else if (data.type === "ice-candidate" && data.target === myName) {
                if(peerConnections[data.sender]) {
                    await peerConnections[data.sender].addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        });

        onChildAdded(ref(db, `group_calls/${roomID}/leave`), (snapshot) => {
            const leftUser = snapshot.val();
            if(leftUser && leftUser !== myName) removeUserFromCall(leftUser);
        });
    }

    async function setupPeerConnection(remoteUser, isInitiator) {
        if(peerConnections[remoteUser]) return;

        const pc = new RTCPeerConnection(rtcConfig);
        peerConnections[remoteUser] = pc;

        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = (event) => {
            addVideoBox(remoteUser, event.streams[0]);
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                push(ref(db, `group_calls/${roomID}/signals`), {
                    type: "ice-candidate", sender: myName, target: remoteUser, candidate: event.candidate.toJSON()
                });
            }
        };

        if (isInitiator) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            push(ref(db, `group_calls/${roomID}/signals`), {
                type: "offer", sender: myName, target: remoteUser, offer: offer
            });
        }
    }

    document.getElementById('acceptCallBtn').onclick = async () => {
        document.getElementById('call-notification').style.display = 'none';
        await initMedia();
        document.getElementById('video-container').style.display = 'block';
        
        push(ref(db, `group_calls/${roomID}/signals`), { type: "join-request", sender: myName });
    };

    document.getElementById('rejectCallBtn').onclick = () => {
        document.getElementById('call-notification').style.display = 'none';
    };

    function removeUserFromCall(user) {
        if(peerConnections[user]) {
            peerConnections[user].close();
            delete peerConnections[user];
        }
        const box = document.getElementById(`vid-box-${user}`);
        if(box) box.remove();

        const grid = document.getElementById('video-grid');
        const container = document.getElementById('video-container');
        if(grid.children.length <= 1) {
            container.classList.remove('multi-call');
        }
    }

    function closeAllCalls() {
        document.getElementById('video-container').style.display = 'none';
        document.getElementById('call-notification').style.display = 'none';
        
        push(ref(db, `group_calls/${roomID}/leave`), myName);

        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }

        Object.keys(peerConnections).forEach(user => {
            peerConnections[user].close();
        });
        peerConnections = {};
        document.getElementById('video-grid').innerHTML = "";
        document.getElementById('video-container').classList.remove('multi-call');
    }

    document.getElementById('startCallBtn').onclick = startGroupCall;
    document.getElementById('endCallBtn').onclick = closeAllCalls;

    document.getElementById('muteMicBtn').onclick = () => {
        isMuted = !isMuted;
        if(localStream) {
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('muteMicBtn').innerText = isMuted ? '🔇' : '🎤';
        }
    };

    document.getElementById('toggleCamBtn').onclick = async () => {
        currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
        if(localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
            document.getElementById(`vid-box-${myName}`).querySelector('video').srcObject = localStream;
            
            Object.keys(peerConnections).forEach(user => {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = peerConnections[user].getSenders().find(s => s.track.kind === 'video');
                if(sender) sender.replaceTrack(videoTrack);
            });
        }
    };

    // FLOATING STABLE DRAGGABLE HANDLER
    const videoCont = document.getElementById("video-container");
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

    videoCont.addEventListener("mousedown", dragStart);
    videoCont.addEventListener("touchstart", dragStart);
    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
    document.addEventListener("mouseup", dragEnd);
    document.addEventListener("touchend", dragEnd);

    function dragStart(e) {
        if (e.target.classList.contains('v-btn') || e.target.tagName === 'VIDEO') return; 
        let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
        let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
        initialX = clientX - xOffset;
        initialY = clientY - yOffset;
        isDragging = true;
    }
    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
            currentX = clientX - initialX;
            currentY = clientY - initialY;
            xOffset = currentX;
            yOffset = currentY;
            videoCont.style.transform = `translate(${currentX}px, ${currentY}px)`;
        }
    }
    function dragEnd() { isDragging = false; }
</script>
</body>
</html>
